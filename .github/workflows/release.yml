name: Release Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter=./packages/* build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build app
        run: pnpm build

      # VS env needed for @electron/rebuild of better-sqlite3 if prebuild misses ABI
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Package Windows installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          pnpm exec electron-builder install-app-deps
          pnpm exec electron-builder --win nsis --x64 --config electron-builder.yml
          Get-ChildItem release -ErrorAction SilentlyContinue
          if (-not (Get-ChildItem release/*.exe -ErrorAction SilentlyContinue)) {
            throw "No .exe produced"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          npm_config_msvs_version: "2022"

      - name: Resolve version and notes
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          NOTES_FILE=release-notes.md
          {
            echo "## Money Tracker $TAG"
            echo
            MERGE_SHA=$(git rev-parse HEAD)
            PR_JSON=$(gh pr list --state merged --base master --search "$MERGE_SHA" --json number,title,body,mergedAt --limit 5 2>/dev/null || echo "[]")
            if [ -n "$PR_JSON" ] && [ "$PR_JSON" != "[]" ]; then
              echo "$PR_JSON" | node -e '
                const prs = JSON.parse(require("fs").readFileSync(0,"utf8"));
                for (const pr of prs) {
                  console.log(`### #${pr.number} ${pr.title}`);
                  console.log();
                  console.log((pr.body || "").trim() || "_Без описания_");
                  console.log();
                }
              '
            else
              echo "### Changes"
              echo
              PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
              if [ -n "$PREV" ]; then
                git log --pretty=format:"- %s (%h)" "$PREV"..HEAD
              else
                git log --pretty=format:"- %s (%h)" -20
              fi
              echo
            fi
          } > "$NOTES_FILE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Money Tracker ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          files: apps/desktop/release/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
