appId: ru.moneytracker.desktop
productName: Money Tracker
electronVersion: 33.4.11
directories:
  output: release
  buildResources: build
asar: true
asarUnpack:
  - "**/*.node"
files:
  # Used from a flat staging dir (scripts/pack-win.mjs) without workspace symlinks.
  - dist/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/@electron/**"
  - "!node_modules/app-builder-*/**"
extraResources:
  - from: ../ui/dist
    to: ui
npmRebuild: true
buildDependenciesFromSource: false
nodeGypRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: MoneyTracker-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Money Tracker
publish: null
