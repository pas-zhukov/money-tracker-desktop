appId: ru.moneytracker.desktop
productName: Money Tracker
directories:
  output: release
  buildResources: build
asar: true
asarUnpack:
  - "**/*.{node,dll}"
  - "**/better-sqlite3/**"
files:
  - dist/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
  - "!node_modules/**/{CHANGELOG.md,README.md,readme.md,README}"
  - "!node_modules/**/{test,tests,__tests__,docs}/**"
extraResources:
  - from: ../ui/dist
    to: ui
npmRebuild: true
buildDependenciesFromSource: false
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: MoneyTracker-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Money Tracker
publish: null